# Build crx for Kiwi Browser Sync
name: Build signed legacy CRX

# Signing is an explicit release operation for legacy browsers.
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      - name: Verify signing is configured
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "::error::Configure the CRX_PRIVATE_KEY repository secret before dispatching a signed release."
            exit 1
          fi

      - name: Checking-out source-code in $GITHUB_WORKSPACE
        uses: actions/checkout@v2

      - uses: cardinalby/webext-buildtools-pack-extension-dir-action@v1
        with:
            extensionDir: '.'
            crxFilePath: './extension.zip'

      - uses: cardinalby/webext-buildtools-chrome-crx-action@v2
        with:
           zipFilePath: './extension.zip'
           crxFilePath: './extension.crx'
           privateKey: ${{ secrets.CRX_PRIVATE_KEY }}

      - name: Creating release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_id }}
          release_name: Generation ${{ github.run_id }}
          draft: false
          prerelease: true
          body: |
            This release was automatically generated from GitHub ${{ github.ref }} in run ID ${{ github.run_id }}.

      - name: Uploading CRX into GitHub release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./extension.crx
          asset_name: Kiwi-Sync-${{ github.run_id }}.crx
          asset_content_type: application/x-chrome-extension
